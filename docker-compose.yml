version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: gizi_balita_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gizi_balita
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - gizi_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: gizi_balita_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - gizi_network

  # Flask Application
  flask_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gizi_balita_flask
    environment:
      FLASK_APP: app.py
      FLASK_ENV: development
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DB: gizi_balita
      SECRET_KEY: gizi-balita-secret-key-2024
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - gizi_network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  gizi_network:
    driver: bridge
